services:
  - type: web
    name: gppw
    runtime: node
    plan: starter
    buildCommand: bun install --frozen-lockfile && bun run build:site
    startCommand: cd apps/site && bun run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: BUN_VERSION
        value: 1.3.14
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gppw-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: WEBSITE_URL
        fromService:
          name: gppw
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: gppw-db
    databaseName: gppw
    user: gppw
    plan: basic-256mb
    postgresMajorVersion: "18"
    ipAllowList: []
